name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
        working-directory: ./angular-dynamic-forms
      - name: Build library
        run: npx ng build dynamic-forms
        working-directory: ./angular-dynamic-forms
      - name: Run tests
        run: npx ng test dynamic-forms --browsers=ChromeHeadless --watch=false
        working-directory: ./angular-dynamic-forms

